name: Security

# Known-vulnerable Go dependencies (govulncheck) and committed secrets (gitleaks, whole history). Runs on every
# pull request into main and push to main (both jobs are required checks), and every Monday so that newly
# published advisories are caught even when nothing changes. A failing scheduled run notifies the maintainer.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: "v1.9.0"
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fails only on vulnerabilities in code OpenWarp actually calls (symbol level). Advisories in required
      # modules that are never reached are listed in the job summary for manual review.
      - name: govulncheck (darwin, the shipping platform)
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          bin="$(go env GOPATH)/bin/govulncheck"
          GOOS=darwin "$bin" -show verbose ./... | tee "$RUNNER_TEMP/vuln.txt"
      - name: Report
        if: always()
        run: |
          { echo '### govulncheck'; echo '```'; tail -n 40 "$RUNNER_TEMP/vuln.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the PR head
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose .
