name: CodeQL

# Static security analysis. Results appear under Security › Code scanning and as PR annotations.
on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      # Build for darwin too: most of the daemon is macOS-only and would otherwise not be analysed.
      - name: Build
        run: |
          GOOS=darwin go build ./...
          go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go

  swift:
    name: CodeQL (Swift)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xcode
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        run: |
          xcodebuild -project OpenWarp.xcodeproj -scheme OpenWarp -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 20
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
