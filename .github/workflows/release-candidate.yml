name: Release candidate

# Runs on every pull request into `release` (the only way to change that branch). It checks that the candidate
# is ready to ship: it comes from `main`, the version is not released yet and has a CHANGELOG section, the
# third-party notices are current, and the universal distribution build is complete. It builds an ad-hoc
# signed test DMG (install-tested on the runner) but never publishes anything: releases are drafted by
# release.yml, run by hand on the release branch, behind the "release" environment's manual approval. The
# regular CI, security, CodeQL and macOS app workflows also run on these pull requests; the "Protect release
# branch" ruleset requires all of them.
on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Release candidate readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, to check the version is not released yet
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Only main is promoted to release; fixes land on main first.
      - name: Source branch is main
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_REF" != main ]; then
            echo "::error::release only takes pull requests from $GITHUB_REPOSITORY:main (got $HEAD_REPO:$HEAD_REF)"; exit 1
          fi

      - name: Version, tag and CHANGELOG
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/buildinfo/buildinfo.go)
          [ -n "$version" ] || { echo "::error::cannot read the version from internal/buildinfo/buildinfo.go"; exit 1; }
          echo "version $version" >> "$GITHUB_STEP_SUMMARY"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged: bump internal/buildinfo/buildinfo.go (and build.sh, FakeDaemon.version)"; exit 1
          fi
          grep -q "^## \[$version\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section: move the [Unreleased] notes there"; exit 1; }
          [ -s "docs/releases/v$version.md" ] || { echo "::error::docs/releases/v$version.md (release notes) is missing"; exit 1; }
          scripts/check-repo.sh

      - name: Third-party notices are current
        run: scripts/third-party-notices.sh --check

  package:
    name: Release candidate package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build.sh
        run: ./build.sh
      - name: Verify the bundle
        run: |
          scripts/verify-app-bundle.sh build/OpenWarp.app arm64 x86_64
          lipo -archs build/openwarp
          codesign --verify --deep --strict build/OpenWarp.app
          # Ad-hoc signed only: say so instead of implying a Developer ID signature or notarization.
          codesign -dv build/OpenWarp.app 2>&1 | grep -E '^Signature=' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package the candidate DMG (not a release)
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/buildinfo/buildinfo.go)
          name="OpenWarp-v$version-rc-${GITHUB_SHA::7}-macos-universal"
          scripts/make-dmg.sh build/OpenWarp.app "dist/$name.dmg"
          ditto -c -k --keepParent build/OpenWarp.app "dist/$name.zip"
          (cd dist && shasum -a 256 "$name.dmg" "$name.zip" | tee SHA256SUMS.txt)
          scripts/verify-dmg.sh "dist/$name.dmg" "$version"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install test (disposable runner)
        run: scripts/ci-install-test.sh "dist/$PACKAGE.dmg" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE }}
          path: |
            dist/${{ env.PACKAGE }}.dmg
            dist/${{ env.PACKAGE }}.zip
            dist/SHA256SUMS.txt
          retention-days: 14
