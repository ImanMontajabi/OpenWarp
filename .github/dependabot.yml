# Dependabot version updates. Security updates are enabled separately in the repository settings and are
# opened as soon as an advisory is published, independent of this schedule. Nothing is auto-merged: every
# update PR runs the full CI and is merged by hand like any other PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "deps(go)"
    groups:
      # Minor and patch updates of all modules in one weekly PR; majors stay separate.
      go-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
